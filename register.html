<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwanachup Hub - App Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        .container {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .app-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }
        .app-card:hover {
            transform: translateY(-5px);
        }
        .app-card img {
            max-width: 100px;
            margin-bottom: 10px;
        }
        .app-card h3 {
            margin: 10px 0;
            font-size: 18px;
        }
        .app-card p {
            font-size: 14px;
            color: #555;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header>
    <h1>Mwanachup Hub - App Dashboard</h1>
    <p>Download your favorite apps here</p>
</header>

<div class="container">
    <!-- App Card Example -->
    <div class="app-card">
        <img src="app1-icon.png" alt="App 1 Icon">
        <h3>App 1</h3>
        <p>Cool app for chatting and fun.</p>
        <a href="downloads/app1.apk" class="download-btn" download>Download</a>
    </div>

    <div class="app-card">
        <img src="app2-icon.png" alt="App 2 Icon">
        <h3>App 2</h3>
        <p>Best game to kill your free time.</p>
        <a href="downloads/app2.apk" class="download-btn" download>Download</a>
    </div>

    <div class="app-card">
        <img src="app3-icon.png" alt="App 3 Icon">
        <h3>App 3</h3>
        <p>Learn coding and tech skills fast.</p>
        <a href="downloads/app3.apk" class="download-btn" download>Download</a>
    </div>
</div>

</body>
</html>
